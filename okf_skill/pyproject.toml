[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-skill"
version = "0.5.0"
description = "Turn a source-code repository into an Open Knowledge Format (OKF v0.1) knowledge bundle, plus an AI-agent skill."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
# PyYAML makes the validator's frontmatter parsing exact; it falls back to a
# lenient regex parser (and warns, W0) when it is missing.
dependencies = ["PyYAML>=6.0"]

[project.scripts]
okf-inventory = "okf_skill.runner:main_inventory"
okf-history = "okf_skill.runner:main_history"
okf-validate = "okf_skill.runner:main_validate"
okf-skill = "okf_skill.installer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"okf_skill._scripts" = ["*.sh", "*.py"]
"okf_skill._skill_assets" = ["*.md", "*.yml", "references/*.md"]
